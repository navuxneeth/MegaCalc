<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumCalc - Advanced Calculator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Load external libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.3.1/decimal.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="light-theme">
    <div class="calculator-container">
        <div class="header">
            <div class="title">QuantumCalc</div>
            <div class="mode-toggles">
                <button id="simpleMode" class="mode-btn active">Simple</button>
                <button id="advancedMode" class="mode-btn">Advanced</button>
                <button id="graphMode" class="mode-btn">Graph</button>
            </div>
            <div class="theme-toggle">
                <i class="fas fa-sun"></i>
                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider round"></span>
                </label>
                <i class="fas fa-moon"></i>
            </div>
        </div>

        <div class="display-container">
            <div class="history" id="history"></div>
            <div class="display" id="display">0</div>
        </div>
        
        <div class="precision-control">
            <span>Precision: </span>
            <input type="range" min="1" max="50" value="10" class="precision-slider" id="precisionSlider">
            <span id="precisionValue">10</span> <span>decimal places</span>
        </div>

        <!-- Simple Calculator Mode -->
        <div class="calculator-keypad simple-mode" id="simpleKeypad">
            <div class="keypad-row">
                <button class="key function">C</button>
                <button class="key function">±</button>
                <button class="key function">%</button>
                <button class="key operator">÷</button>
            </div>
            <div class="keypad-row">
                <button class="key number">7</button>
                <button class="key number">8</button>
                <button class="key number">9</button>
                <button class="key operator">×</button>
            </div>
            <div class="keypad-row">
                <button class="key number">4</button>
                <button class="key number">5</button>
                <button class="key number">6</button>
                <button class="key operator">−</button>
            </div>
            <div class="keypad-row">
                <button class="key number">1</button>
                <button class="key number">2</button>
                <button class="key number">3</button>
                <button class="key operator">+</button>
            </div>
            <div class="keypad-row">
                <button class="key number zero">0</button>
                <button class="key number">.</button>
                <button class="key equal">=</button>
            </div>
        </div>

        <!-- Advanced Calculator Mode -->
        <div class="calculator-keypad advanced-mode hidden" id="advancedKeypad">
            <div class="keypad-row">
                <button class="key function">C</button>
                <button class="key function">MC</button>
                <button class="key function">MR</button>
                <button class="key function">M+</button>
                <button class="key function">M−</button>
            </div>
            <div class="keypad-row">
                <button class="key function">2<sup>nd</sup></button>
                <button class="key function">π</button>
                <button class="key function">e</button>
                <button class="key function">Rand</button>
                <button class="key function">Ans</button>
            </div>
            <div class="keypad-row">
                <button class="key function">x²</button>
                <button class="key function">x³</button>
                <button class="key function">x<sup>y</sup></button>
                <button class="key function">10<sup>x</sup></button>
                <button class="key function">log</button>
            </div>
            <div class="keypad-row">
                <button class="key function">√x</button>
                <button class="key function">∛x</button>
                <button class="key function">∜x</button>
                <button class="key function">ln</button>
                <button class="key function">log<sub>y</sub>x</button>
            </div>
            <div class="keypad-row">
                <button class="key function">sin</button>
                <button class="key function">cos</button>
                <button class="key function">tan</button>
                <button class="key function">(</button>
                <button class="key function">)</button>
            </div>
            <div class="keypad-row">
                <button class="key number">7</button>
                <button class="key number">8</button>
                <button class="key number">9</button>
                <button class="key operator">÷</button>
                <button class="key function">!</button>
            </div>
            <div class="keypad-row">
                <button class="key number">4</button>
                <button class="key number">5</button>
                <button class="key number">6</button>
                <button class="key operator">×</button>
                <button class="key function">mod</button>
            </div>
            <div class="keypad-row">
                <button class="key number">1</button>
                <button class="key number">2</button>
                <button class="key number">3</button>
                <button class="key operator">−</button>
                <button class="key function">|x|</button>
            </div>
            <div class="keypad-row">
                <button class="key number">0</button>
                <button class="key number">.</button>
                <button class="key function">×10<sup>n</sup></button>
                <button class="key operator">+</button>
                <button class="key equal">=</button>
            </div>
        </div>

        <!-- Graphing Mode -->
        <div class="graphing-mode hidden" id="graphingMode">
            <div class="graph-controls">
                <div class="function-input">
                    <label for="functionInput">f(x) = </label>
                    <input type="text" id="functionInput" placeholder="e.g., x^2 + 2*x + 1">
                    <button id="plotBtn" class="plot-btn">Plot</button>
                </div>
                <div class="graph-options">
                    <div class="range-inputs">
                        <div>
                            <label for="xMinInput">x min:</label>
                            <input type="number" id="xMinInput" value="-10" step="1">
                        </div>
                        <div>
                            <label for="xMaxInput">x max:</label>
                            <input type="number" id="xMaxInput" value="10" step="1">
                        </div>
                        <div>
                            <label for="yMinInput">y min:</label>
                            <input type="number" id="yMinInput" value="-10" step="1">
                        </div>
                        <div>
                            <label for="yMaxInput">y max:</label>
                            <input type="number" id="yMaxInput" value="10" step="1">
                        </div>
                    </div>
                    <div class="color-picker">
                        <label for="graphColor">Line Color:</label>
                        <input type="color" id="graphColor" value="#ff0000">
                    </div>
                    <div class="zoom-controls">
                        <button id="zoomIn"><i class="fas fa-search-plus"></i></button>
                        <button id="zoomOut"><i class="fas fa-search-minus"></i></button>
                        <button id="resetZoom"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>
            </div>
            <div class="graph-container">
                <canvas id="graphCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="js/calculator.js"></script>
    <script src="js/graphing.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
